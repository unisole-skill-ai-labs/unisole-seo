<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://res.cloudinary.com/hehmsemf/image/upload/f_auto,q_auto,w_64/v1785299421/Unisole_logo_new_mhqbma.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unisole Skill AI Labs - Building India's Next Generation of AI Innovators</title>
    <meta name="description" content="Unisole Skill AI Labs delivers world-class Artificial Intelligence education, research mentorship, and industrial AI implementation programs." />
    <meta name="theme-color" content="#ffffff" />

    <!-- Preconnect to critical origins used above-the-fold -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload LCP Hero Image for instant rendering -->
    <link
      rel="preload"
      as="image"
      href="https://res.cloudinary.com/da3sqradg/image/upload/f_auto,q_auto,w_600,c_limit/v1783159721/ajay_mokta_millionare_cr33xx.png"
      fetchpriority="high"
    />

    <!-- Asynchronous Non-blocking Font Loading -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;1,600&family=Instrument+Serif:ital@1&display=swap"
    />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;1,600&family=Instrument+Serif:ital@1&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;1,600&family=Instrument+Serif:ital@1&display=swap"
